<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Horizon</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
}

body{
position:relative;
}

#stars{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%, white 1px, transparent 1px),
radial-gradient(circle at 80% 20%, white 1px, transparent 1px),
radial-gradient(circle at 40% 70%, white 1px, transparent 1px),
radial-gradient(circle at 70% 80%, white 1px, transparent 1px),
radial-gradient(circle at 10% 80%, white 1px, transparent 1px);
background-size:120px 120px;
opacity:.8;
}

.blackhole{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(38vw,38vh);
height:min(38vw,38vh);
background:black;
border-radius:50%;
z-index:5;
pointer-events:none;
box-shadow:
0 0 80px rgba(255,180,80,.25);
}

.disk{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(100vw,1200px);
height:min(18vw,180px);
border-radius:50%;
z-index:2;
pointer-events:none;

background:
linear-gradient(
90deg,
rgba(255,180,50,0) 0%,
rgba(255,190,90,.6) 20%,
rgba(255,255,255,1) 35%,
rgba(255,180,50,.8) 50%,
rgba(255,255,255,1) 65%,
rgba(255,190,90,.6) 80%,
rgba(255,180,50,0) 100%
);

filter:blur(6px);

animation:diskMove 8s ease-in-out infinite;
}

@keyframes diskMove{

0%{
transform:translate(-50%,-50%) scaleY(1);
}

50%{
transform:translate(-50%,-50%) scaleY(.92);
}

100%{
transform:translate(-50%,-50%) scaleY(1);
}

}

.orbit{
position:absolute;
left:50%;
top:50%;
width:0;
height:0;
pointer-events:none;
}

.object{
position:absolute;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:44px;
width:82px;
height:82px;
border-radius:50%;
backdrop-filter:blur(6px);
pointer-events:auto;
z-index:9999;
transition:.25s;
}

.object:hover{
transform:scale(1.25);
}

.label{
position:absolute;
top:95px;
left:50%;
transform:translateX(-50%);
font-size:12px;
white-space:nowrap;
color:white;
font-weight:bold;
text-shadow:0 0 8px black;
}

.nuclear{
background:#1f8fff55;
}

.semi{
background:#00d5ff55;
}

.mech{
background:#b64cff55;
}

.radio{
background:#47ff6b55;
}

.video{
background:#ff6b3d55;
}

.r1{
animation:rot1 30s linear infinite;
}
.r2{
animation:rot2 45s linear infinite;
}
.r3{
animation:rot3 38s linear infinite;
}
.r4{
animation:rot4 55s linear infinite;
}
.r5{
animation:rot5 12s linear infinite;
}

@keyframes rot1{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes rot2{
from{transform:rotate(360deg);}
to{transform:rotate(0deg);}
}

@keyframes rot3{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes rot4{
from{transform:rotate(360deg);}
to{transform:rotate(0deg);}
}

@keyframes rot5{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@media(max-width:768px){

.object{
width:70px;
height:70px;
font-size:34px;
}

.label{
font-size:10px;
top:80px;
}

.blackhole{
width:48vw;
height:48vw;
}

}

</style>
</head>

<body>

<div id="stars"></div>

<div class="disk"></div>
<div class="blackhole"></div>

<div class="orbit r1">
<a class="object nuclear"
style="transform:translateX(350px)"
href="https://drive.google.com/drive/folders/1pgVjmirx5zQP5v_W080ue8qMUYkrs1oS?usp=sharing"
target="_blank">
⚛️
<div class="label">Фізика ядра</div>
</a>
</div>

<div class="orbit r2">
<a class="object semi"
style="transform:translateX(260px)"
href="https://drive.google.com/drive/folders/1_gnIbizWyluyhaHodqn8mg7JbauR3Igd?usp=sharing"
target="_blank">
💎
<div class="label">Напівпровідники</div>
</a>
</div>

<div class="orbit r3">
<a class="object mech"
style="transform:translateX(460px)"
href="https://drive.google.com/drive/folders/1k0wxwbMrUFMAlsgtt0J_MvD8pNOlIF3f?usp=sharing"
target="_blank">
🪐
<div class="label">Теоретична механіка</div>
</a>
</div>

<div class="orbit r4">
<a class="object radio"
style="transform:translateX(560px)"
href="https://drive.google.com/drive/folders/1vwclRm7k7wVxIQWNTVWecNj9tlskMgWr?usp=sharing"
target="_blank">
📡
<div class="label">Радіотехніка</div>
</a>
</div>

<div class="orbit r5">
<a class="object video"
style="transform:translateX(210px)"
href="https://drive.google.com/drive/folders/1yQppVQqbycx3ckBJ_e9AnZ7OGgzNRnbl?usp=sharing"
target="_blank">
🌠
<div class="label">Відео лекцій</div>
</a>
</div>

</body>
</html>
